[project]
name = "backend"
version = "0.1.0"
description = "Second Thoughts backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "keenable>=0.1.5",
    "nace-sdk>=0.8.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[tool.uv]
package = false
